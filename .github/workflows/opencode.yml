name: 'Setup OpenCode Config'
description: 'Create opencode.json for GitHub Actions'
runs:
  using: 'composite'
  steps:
    - name: Create OpenCode config
      shell: bash
      run: |
        mkdir -p ~/.config/opencode
        cat > ~/.config/opencode/opencode.json << 'EOF'
        {
          "$schema": "https://opencode.ai/config.json",
          "logLevel": "DEBUG",
          "plugin": [
            "@vymalo/opencode-oauth2",
            "@vymalo/opencode-models-info"
          ],
          "provider": {
            "lightbridge": {
              "npm": "@ai-sdk/openai-compatible",
              "options": {
                "baseURL": "https://api.ai.camer.digital/v1",
                "oauth2": {
                  "issuer": "https://auth.verif.fyi/realms/camer-digital/",
                  "clientId": "converse-frontend",
                  "scopes": ["openid"],
                  "authFlow": "jwt_bearer",
                  "subjectTokenSource": {
                    "type": "github_actions",
                    "audience": "https://auth.verif.fyi/realms/camer-digital/"
                  },
                  "meta": {
                    "modelsInfoUrl": "/models"
                  }
                }
              }
            }
          }
        }
        EOF


name: opencode
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write    # Required for OIDC token
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup OpenCode Config
        uses: ./.github/actions/opencode-config

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@v1.16.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: lightbridge/glm-5
          agent: auto-review
          use_github_token: true