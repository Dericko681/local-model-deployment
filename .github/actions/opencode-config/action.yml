name: 'Setup OpenCode Config'
description: 'Create opencode.json for GitHub Actions'
runs:
  using: 'composite'
  steps:
    - name: Create OpenCode config
      shell: bash
      env:
        OPENCODE_BASE_URL: ${{ env.OPENCODE_BASE_URL }}
        OAUTH2_ISSUER: ${{ env.OAUTH2_ISSUER }}
        OAUTH2_CLIENT_ID: ${{ env.OAUTH2_CLIENT_ID }}
        OAUTH2_CLIENT_SECRET: ${{ env.OAUTH2_CLIENT_SECRET }}
        OPENCODE_MODEL: ${{ env.OPENCODE_MODEL }}
      run: |
        mkdir -p ~/.config/opencode
        cat > ~/.config/opencode/opencode.json << 'EOF'
        {
          "$schema": "https://opencode.ai/config.json",
          "logLevel": "DEBUG",
          "plugin": ["@vymalo/opencode-oauth2"],
          "provider": {
            "lightbridge": {
              "npm": "@ai-sdk/openai-compatible",
              "options": {
                "baseURL": "${OPENCODE_BASE_URL}",
                "oauth2": {
                  "issuer": "${OAUTH2_ISSUER}",
                  "clientId": "${OAUTH2_CLIENT_ID}",
                  "clientSecret": "${OAUTH2_CLIENT_SECRET}",
                  "scopes": ["openid"],
                  "authFlow": "client_credentials"
                }
              },
              "models": {
                "${OPENCODE_MODEL}": {
                  "id": "${OPENCODE_MODEL}",
                  "tool_call": true
                }
              }
            }
          },
          "agent": {
            "coder": {
              "model": "lightbridge:${OPENCODE_MODEL}"
            }
          }
        }
        EOF