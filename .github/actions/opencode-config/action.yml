name: 'Setup OpenCode Config'
description: 'Create opencode.json for GitHub Actions'
inputs:
  opencode-base-url:
    required: true
  oauth2-issuer:
    required: true
  oauth2-client-id:
    required: true
  oauth2-client-secret:
    required: true
  opencode-model:
    required: true
runs:
  using: 'composite'
  steps:
    - name: Create OpenCode config
      shell: bash
      env:
        OPENCODE_BASE_URL: ${{ inputs.opencode-base-url }}
        OAUTH2_ISSUER: ${{ inputs.oauth2-issuer }}
        OAUTH2_CLIENT_ID: ${{ inputs.oauth2-client-id }}
        OAUTH2_CLIENT_SECRET: ${{ inputs.oauth2-client-secret }}
        OPENCODE_MODEL: ${{ inputs.opencode-model }}
      run: |
        mkdir -p ~/.config/opencode
        cat > ~/.config/opencode/opencode.json << EOF
        {
          "$schema": "https://opencode.ai/config.json",
          "logLevel": "DEBUG",
          "plugin": ["@vymalo/opencode-oauth2"],
          "provider": {
            "lightbridge": {
              "npm": "@ai-sdk/openai-compatible",
              "options": {
                "baseURL": "${OPENCODE_BASE_URL}",
                "oauth2": {
                  "issuer": "${OAUTH2_ISSUER}",
                  "clientId": "${OAUTH2_CLIENT_ID}",
                  "clientSecret": "${OAUTH2_CLIENT_SECRET}",
                  "scopes": ["openid"],
                  "authFlow": "client_credentials"
                }
              },
              "models": {
                "${OPENCODE_MODEL}": {
                  "id": "${OPENCODE_MODEL}",
                  "tool_call": true
                }
              }
            }
          },
          "agent": {
            "coder": {
              "model": "lightbridge:${OPENCODE_MODEL}"
            }
          }
        }
        EOF