# Cert-Manager configuration
certManager:
  enabled: true

  # Self-signed CA bootstrap for internal cluster TLS (Knative, KServe)
  selfSigned:
    enabled: true
    commonName: "Knative Internal Root CA"

  # ACME HTTP-01 solver ClusterIssuer for external domain TLS
  solvers:
    http:
      ingressClassName: ""
      email: ""

  # Optional Cloudflare DNS-01 ClusterIssuer
  issuerCloudflare: {}

  # Knative cert-manager integration
  knative:
    certificateClass: "cert-manager.certificate.networking.knative.dev"
    issuerRefs:
      external:
        name: "cert-acme-http"
        kind: "ClusterIssuer"
      clusterLocal:
        name: "self-signed-ca"
        kind: "ClusterIssuer"
      systemInternal:
        name: "self-signed-ca"
        kind: "ClusterIssuer"

  # Trust bundle for Knative internal TLS
  trustBundle:
    enabled: true
    caBundle: ""
    caSecret:
      name: ""
    caConfigMap:
      name: ""
    namespaces:
      - knative-serving
      - kourier-system

  # Namespace resource guardrails
  guardrails:
    enabled: false
    limits:
      container:
        defaultRequest:
          cpu: 50m
          memory: 64Mi
        default:
          cpu: 200m
          memory: 256Mi
        max:
          cpu: "2"
          memory: 2Gi
    quota:
      requests.cpu: 500m
      requests.memory: 512Mi
      limits.cpu: "3"
      limits.memory: 4Gi
      count/pods: 15

  # Optional ingress TLS certificate
  certificate:
    enabled: false
    name: "llm-tls-cert"
    namespace: "kourier-system"
    secretName: "llm-tls"
    commonName: "*.llm.local"
    dnsNames:
      - "*.llm.local"
      - "*.llm-system.llm.local"
    issuerRef:
      name: "cert-self-signed-ca"
      kind: "ClusterIssuer"

serving:
  global:
    nameOverride: model-deployment
    createDefaultServiceAccount: false

  rbac:
    roles:
      certmanager-reader:
        enabled: true
        type: ClusterRole
        rules:
          - apiGroups: ["cert-manager.io"]
            resources: ["clusterissuers", "issuers"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["cert-manager.io"]
            resources: ["certificates", "certificaterequests"]
            verbs: ["get", "list", "watch", "create", "update", "delete"]
    bindings:
      certmanager-reader:
        enabled: true
        type: ClusterRoleBinding
        roleRef:
          identifier: certmanager-reader
        subjects:
          - kind: ServiceAccount
            name: default
            namespace: "{{ .Release.Namespace }}"

  configMaps:
    phi2-chat-template:
      enabled: true
      forceRename: phi2-chat-template
      data:
        chat_template.jinja: |
          {% for message in messages %}
          {% if message['role'] == 'user' %}
          User: {{ "{{" }} message['content'] {{ "}}" }}
          {% elif message['role'] == 'assistant' %}
          Assistant: {{ "{{" }} message['content'] {{ "}}" }}
          {% elif message['role'] == 'system' %}
          System: {{ "{{" }} message['content'] {{ "}}" }}
          {% endif %}
          {% endfor %}
          {% if add_generation_prompt %}
          Assistant:
          {% endif %}

  persistence:
    model-cache:
      enabled: true
      type: persistentVolumeClaim
      forceRename: model-cache
      size: 50Gi
      accessMode: ReadWriteOnce
      retain: true
      storageClass: ""

  # NetworkPolicy via bjw-s app-template
  networkpolicies:
    main:
      enabled: false
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      rules:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: knative-serving
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
            ports:
              - protocol: TCP
                port: 8080
        egress:
          - to:
              - namespaceSelector: {}
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 443
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 80

  # ServiceMonitor via bjw-s app-template
  serviceMonitor:
    main:
      enabled: false
      selector:
        matchLabels:
          serving.kserve.io/inferenceservice: vllm-phi2
      endpoints:
        - port: http1
          interval: 30s
          scrapeTimeout: 10s
          honorLabels: false
          path: /metrics
          scheme: http

  # Raw resources via bjw-s app-template (for KServe-scoped resources)
  rawResources:
    # PrometheusRule for alerting (inner spec: is the actual PrometheusRule body — bjw-s wraps spec:)
    prometheus-alerts:
      enabled: false
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      spec:
        spec:
          groups:
            - name: model-inference
              interval: 30s
              rules:
                - alert: ModelInferenceServiceDown
                  expr: 'kserve_inference_service_status_ready{namespace="{{ .Release.Namespace }}"} == 0'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Inference Service is down"
                    description: 'Inference Service {{ "{{" }} $labels.inference_service {{ "}}" }} has been down for more than 5 minutes.'
                - alert: ModelInferenceHighLatency
                  expr: 'histogram_quantile(0.95, rate(kserve_inference_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m])) > 10'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High inference latency detected"
                    description: '95th percentile latency is above 10 seconds for {{ "{{" }} $labels.inference_service {{ "}}" }}.'
                - alert: ModelInferenceHighErrorRate
                  expr: 'rate(kserve_inference_request_total{namespace="{{ .Release.Namespace }}", status_code=~"5.."}[5m]) / rate(kserve_inference_request_total{namespace="{{ .Release.Namespace }}"}[5m]) > 0.1'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High error rate detected"
                    description: 'Error rate is above 10% for {{ "{{" }} $labels.inference_service {{ "}}" }}.'


servingRuntimes:
  vllm-cpu:
    enabled: true
    annotations: {}
    labels: {}
    spec:
      multiModel: false
      disabled: false
      supportedModelFormats:
        - name: huggingface
          version: "1"
          autoSelect: true
          priority: 1
      protocolVersions:
        - v1
      containers:
        kserve-container:
          image:
            repository: substratusai/vllm
            tag: main-cpu
            pullPolicy: IfNotPresent
          ports:
            http1:
              containerPort: 8080
              protocol: TCP
          env:
            HF_HOME: /hf-cache
            HF_HUB_DOWNLOAD_TIMEOUT: "600"
            VLLM_CPU_KVCACHE_SPACE: "4"
          resources: {}
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
      nodeSelector: {}
      tolerations: []
      affinity: {}

inferenceServiceDefaults:
  visibility: ""
  deploymentMode: "Serverless"
  observability:
    enabled: true
    prometheus:
      enabled: true
      port: "8080"
      path: "/metrics"
      scheme: "http"
    metricAggregation:
      enabled: false
    opentelemetry:
      enabled: false
      sidecarInject: ""
    autoscaling:
      class: ""
      metrics: []

inferenceServices:
  phi2:
    enabled: true
    name: vllm-phi2
    visibility: ""
    deploymentMode: "Serverless"
    certificate:
      class: ""
    observability:
      enabled: true
      prometheus:
        enabled: true
        port: "8080"
        path: "/metrics"
        scheme: "http"
      metricAggregation:
        enabled: false
      opentelemetry:
        enabled: false
        sidecarInject: ""
      autoscaling:
        class: ""
        metrics: []
    annotations:
      autoscaling.knative.dev/maxScale: "3"
    labels:
      app: vllm-phi2
    spec:
      predictor:
        maxReplicas: 3
        timeout: 300
        scaleMetric: concurrency
        scaleTarget: 10
        model:
          modelFormat:
            name: huggingface
          runtime: vllm-cpu
          storageUri: hf://microsoft/phi-2
          args:
            host: 0.0.0.0
            port: "8080"
            model: microsoft/phi-2
            max-model-len: "2048"
            device: cpu
            dtype: float32
            chat-template: /chat-template/chat_template.jinja
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            model-cache:
              mountPath: /hf-cache
            chat-template:
              mountPath: /chat-template
              readOnly: true
        volumes:
          chat-template:
            configMap:
              name: phi2-chat-template
          model-cache:
            persistentVolumeClaim:
              claimName: model-cache

